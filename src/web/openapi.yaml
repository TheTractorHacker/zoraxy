openapi: 3.0.3
info:
  title: Zoraxy REST API
  version: "1.0.0"
  description: |
    Stable, token authenticated subset of the Zoraxy management API.

    Create a token in the admin panel (Others > API Tokens). Send it as
    `Authorization: Bearer zrx_...`. Tokens have a scope: `read` allows GET and
    HEAD only, `readwrite` allows everything documented here. Tokens can have an
    expiry and an IP/CIDR allow-list. Requests are rate limited (HTTP 429).
    Authentication failures return a generic 401 or 403 body.

    No CSRF token is needed (and cookies are ignored) on `/api/v1`. Bearer tokens
    are NOT accepted anywhere else, and token management itself needs the normal
    admin login.

    Request bodies are flat JSON objects whose keys are the parameter names used
    by the corresponding admin UI call (`/api/proxy/add`, `/api/proxy/edit`);
    values may be strings, numbers or booleans. Errors use `{"error": "..."}`.

    ## Not part of the token API

    This document lists the complete `/api/v1` surface; nothing else accepts a
    token. Everything the admin panel does beyond it is cookie + CSRF only and is
    deliberately not exposed here, for example: CAPTCHA settings and page
    branding (`/api/proxy/captcha/*`), proxy rule templates (`/api/proxy/templates/*`),
    the updater (`/api/updater/*`), API token management (`/api/apitoken/*`),
    configuration backup and restore, certificate upload and ACME, cluster and fleet
    management, SSO / OAuth2 providers, scripting, plugins, and user or role
    administration. Create or change those objects in the admin panel; the
    proxy-rule endpoints below carry the common rule fields only. The rules engine can be read with a
    token (`/api/v1/ruleset/*`); its rules and lists are created and changed in the admin panel (`/api/ruleset/*`).
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Service health and version
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  version: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/proxy-rules:
    get:
      summary: List HTTP proxy rules
      description: Password hashes are never returned.
      operationId: listProxyRules
      parameters:
        - name: type
          in: query
          schema: {type: string, enum: [host, root], default: host}
      responses:
        "200":
          description: Array of proxy rules (host) or the default site (root)
          content:
            application/json:
              schema: {}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    post:
      summary: Create a proxy rule
      description: Requires a readwrite token.
      operationId: createProxyRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rootname, ep]
              additionalProperties: true
              properties:
                rootname: {type: string, description: "Matching domain, e.g. app.example.com (extra aliases comma separated)"}
                ep: {type: string, description: "Upstream target, e.g. 127.0.0.1:8080"}
                tls: {type: boolean, description: "Upstream uses TLS"}
                tlsval: {type: boolean, description: "Skip upstream TLS validation"}
                access: {type: string, description: "Access rule ID (default: default)"}
                tags: {type: string}
      responses:
        "201": {description: Created}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/proxy-rules/{rootname}:
    parameters:
      - $ref: "#/components/parameters/rootname"
    get:
      summary: Get one proxy rule
      operationId: getProxyRule
      responses:
        "200": {description: The proxy rule, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    patch:
      summary: Update a proxy rule (partial)
      description: Only the supplied keys change. Requires a readwrite token.
      operationId: updateProxyRule
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: Updated}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    delete:
      summary: Delete a proxy rule
      description: Requires a readwrite token.
      operationId: deleteProxyRule
      responses:
        "200": {description: Deleted}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/proxy-rules/{rootname}/enable:
    parameters:
      - $ref: "#/components/parameters/rootname"
    post:
      summary: Enable a proxy rule
      description: Requires a readwrite token.
      operationId: enableProxyRule
      responses:
        "200": {description: Enabled}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/proxy-rules/{rootname}/disable:
    parameters:
      - $ref: "#/components/parameters/rootname"
    post:
      summary: Disable a proxy rule
      description: Requires a readwrite token.
      operationId: disableProxyRule
      responses:
        "200": {description: Disabled}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/access-rules:
    get:
      summary: List access rules (access lists)
      operationId: listAccessRules
      responses:
        "200": {description: Array of access rules, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/redirects:
    get:
      summary: List redirection rules
      operationId: listRedirects
      responses:
        "200": {description: Array of redirection rules, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/certificates:
    get:
      summary: List TLS certificates with expiry information
      operationId: listCertificates
      responses:
        "200": {description: Array of certificates, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/stats/summary:
    get:
      summary: Today's traffic statistics
      operationId: getStatsSummary
      parameters:
        - name: fast
          in: query
          description: Only return the request counters
          schema: {type: boolean}
      responses:
        "200": {description: Statistics, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/stats/blocked:
    get:
      summary: Requests Zoraxy blocked, and why
      description: >
        Summary (counts by reason, top client IPs, hosts and paths, hourly series of the last 24 hours) plus one
        page of the bounded blocked-request log (the last 2000 entries, newest first). Honours the statistics
        exclusion settings; query strings are only kept when the visitor list keeps them.
      operationId: getBlockedRequests
      parameters:
        - name: reason
          in: query
          description: Only this reason (blacklist, whitelist, auto-ban, ratelimit, waf, exploit, bot, header-rule, captcha, country-challenge, path-rule, client-cert, peer, auth, plugin)
          schema: {type: string}
        - name: host
          in: query
          schema: {type: string}
        - name: ip
          in: query
          schema: {type: string}
        - name: q
          in: query
          description: Search text (IP, host, path, detail, user agent)
          schema: {type: string}
        - name: since
          in: query
          description: Only the last N hours (0 = everything kept)
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: before
          in: query
          description: Sequence number of the last entry of the previous page
          schema: {type: integer, minimum: 0}
      responses:
        "200": {description: Summary and entries, content: {application/json: {schema: {type: object}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/waf/coverage:
    get:
      summary: WAF coverage per proxy rule
      operationId: getWafCoverage
      responses:
        "200": {description: Coverage entries, content: {application/json: {schema: {}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/ruleset/rules:
    get:
      summary: Rules of the rules engine (read only)
      description: >
        The rules of one rule set in evaluation order, each with its expression, structured tree, action,
        warnings and hit counters. Creating and changing rules is done in the admin panel.
      operationId: listRulesetRules
      parameters:
        - name: site
          in: query
          description: Proxy rule key; empty or absent is the global rule set, `_default_site` the default site
          schema: {type: string}
      responses:
        "200": {description: Array of rules, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /api/v1/ruleset/lists:
    get:
      summary: Named lists used by the rules engine (read only)
      operationId: listRulesetLists
      responses:
        "200": {description: Array of lists with the rules that use them, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API token created in the admin panel, prefix zrx_"
  parameters:
    rootname:
      name: rootname
      in: path
      required: true
      description: Matching domain of the proxy rule
      schema: {type: string}
  responses:
    BadRequest:
      description: The operation was rejected (message in the error field)
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: Missing, malformed, unknown, revoked or expired token
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: Read-only token used for a write, or client IP not allowed
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: Not found
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TooManyRequests:
      description: Rate limited
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
